version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Etc/UTC"
    ignore:
      - dependency-name: "fumadocs-mdx"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "fumadocs-core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "fumadocs-ui"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
      - "automerge"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "automerge"
