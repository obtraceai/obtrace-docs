name: Build & Push Image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "content/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "next.config.mjs"
      - "tsconfig.json"
  workflow_dispatch:

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /tmp && rm -rf obtrace-docs && git clone https://github.com/obtraceai/obtrace-docs.git
            cd obtrace-docs
            nerdctl -n k8s.io build -t localhost:30500/docs:latest -t localhost:30500/docs:${{ github.sha }} .
            nerdctl -n k8s.io push localhost:30500/docs:latest
            nerdctl -n k8s.io push localhost:30500/docs:${{ github.sha }}
            kubectl rollout restart deployment/obtrace-docs -n obtrace
            rm -rf /tmp/obtrace-docs
