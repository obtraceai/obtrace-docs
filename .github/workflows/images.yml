name: Build & Push Image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "content/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "next.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-docs
  cancel-in-progress: true

env:
  REGISTRY: obtrace-registry.obtrace-infra.svc.cluster.local:5000

jobs:
  build-deploy:
    runs-on: obtrace-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            -t ${REGISTRY}/docs:latest \
            -t ${REGISTRY}/docs:${SHORT_SHA} .
          docker push ${REGISTRY}/docs:latest
          docker push ${REGISTRY}/docs:${SHORT_SHA}

      - name: Restart deployment
        run: kubectl rollout restart deployment/obtrace-docs -n obtrace 2>/dev/null || true
