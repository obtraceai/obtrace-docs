name: Build & Push Image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "content/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "next.config.mjs"
      - "tsconfig.json"
  workflow_dispatch:

concurrency:
  group: build-docs
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/obtraceai
  IMAGE_NAME: docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

  deploy:
    name: Trigger rollout
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Restart docs on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            crictl pull ghcr.io/obtraceai/docs:latest 2>/dev/null || true
            kubectl rollout restart deployment/docs -n obtrace 2>/dev/null || true
