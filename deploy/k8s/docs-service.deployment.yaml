apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-service
  labels:
    app: docs-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docs-service
  template:
    metadata:
      labels:
        app: docs-service
    spec:
      containers:
        - name: docs-service
          image: ghcr.io/obtrace/docs-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3005"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: docs-service
spec:
  selector:
    app: docs-service
  ports:
    - name: http
      port: 80
      targetPort: 3005
